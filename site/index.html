<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
  <meta name="description" content="从“你好”这个 Hello World 入手，查看真实 Codex Desktop 的请求、响应和请求中可见的完整上下文。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Codex 是如何工作的">
  <meta property="og:description" content="从“你好”这个 Hello World 入手，查看真实 Codex Desktop 的请求、响应和请求中可见的完整上下文。">
  <meta property="og:url" content="https://chrichuang218.github.io/how-codex-works/">
  <title>Codex 是如何工作的</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%237953d2'/%3E%3Cpath d='M11 12h9a8 8 0 0 1 8 8v8M11 12v16h17' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <script>
    // A saved choice wins; otherwise follow the system color scheme.
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('ah-theme'); } catch {}
      if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>请启用 JavaScript 阅读交互教程，也可以直接访问 <a href="https://github.com/chrichuang218/how-codex-works">GitHub 仓库</a> 阅读 Markdown 与实验记录。</noscript>
  <script type="module" src="/main.js"></script>
</body>
</html>
